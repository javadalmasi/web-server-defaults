<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعداد درخواست‌های زیاد</title>
    <link href="assets/css/fonts.css" rel="stylesheet">
    <script src="assets/js/gsap.min.js"></script>
    <link href="assets/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2193b0, #6dd5ed, #2193b0);
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="white" stroke-width="1.5"/>
                <path d="M8 12H16M12 8V16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M16 12H17M7 12H8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <h1 id="title">۴۲۹</h1>
        <p id="subtitle">تعداد درخواست‌های شما بیش از حد مجاز است. لطفاً کمی صبر کنید و دوباره تلاش کنید.</p>
        <a href="/" class="btn" id="homeBtn">بازگشت به صفحه اصلی</a>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const s = Math.random() * 60 + 10;
            p.style.width = p.style.height = `${s}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.top = `${Math.random() * 100}%`;
            p.style.animation = `float ${Math.random() * 20 + 15}s infinite ease-in-out ${Math.random() * 5}s`;
            particlesContainer.appendChild(p);
        }
        const style = document.createElement('style');
        style.textContent = `@keyframes float {0%,100%{transform:translate(0,0)}25%{transform:translate(${Math.random()*100-50}px,${Math.random()*100-50}px)}50%{transform:translate(${Math.random()*100-50}px,${Math.random()*100-50}px)}75%{transform:translate(${Math.random()*100-50}px,${Math.random()*100-50}px)}}`;
        document.head.appendChild(style);

        gsap.set("#title, #subtitle, #homeBtn", { opacity: 0, y: 30 });
        gsap.to("#title", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" });
        gsap.to("#subtitle", { opacity: 1, y: 0, duration: 0.8, delay: 0.2, ease: "power3.out" });
        gsap.to("#homeBtn", { opacity: 1, y: 0, duration: 0.8, delay: 0.4, ease: "power3.out" });
        gsap.to("body", { backgroundPosition: "400% 400%", duration: 20, repeat: -1, ease: "none" });
    </script>
</body>
</html>
